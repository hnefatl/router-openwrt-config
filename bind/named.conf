options {
	directory "/var/cache/bind";
	listen-on port 5353 { 127.0.0.1; };
        allow-recursion {
                none;
        };
        allow-transfer {
                none;
        };
        allow-update {
                none;
        };
 	querylog yes;
};
include "/etc/bind/named-rndc.conf";

zone "keith.collister.xyz" {
        type master;
        file "/etc/bind/zones/keith.collister.xyz.zone";
};

logging {
        channel querylog {
		stderr;
                severity debug 11;
        };
};

// TODO: look into using bind views to provide an "internal view" as well as
// "external view", so that all DNS goes through bind?

include "/etc/bind/keys/keys.conf";
acl nonlocal {
        ! 10.20.0.0/16;
};
zone "warthog.keith.collister.xyz" {
        type master;
        file "/etc/bind/zones/warthog.keith.collister.xyz.zone";
        update-policy {
                // Try to prevent remote devices from attempting updates. UDP
                // source IP spoofing is still a risk.
                deny nonlocal zonesub ANY;
                // Grant key named "dynamic" permissions to change the given
                // records on the zone name or subdomain thereof.
                // https://bind9.readthedocs.io/en/v9_16_5/reference.html#dynamic-update-policies
                grant dynamic zonesub A AAAA TXT;
        };
};
zone "ha.keith.collister.xyz" {
        type master;
        file "/etc/bind/zones/ha.keith.collister.xyz.zone";
        update-policy {
                deny nonlocal zonesub ANY;
                grant dynamic zonesub A AAAA TXT;
        };
};
zone "vpn.keith.collister.xyz" {
        type master;
        file "/etc/bind/zones/vpn.keith.collister.xyz.zone";
        update-policy {
                deny nonlocal zonesub ANY;
                grant dynamic zonesub A AAAA TXT;
        };
};
