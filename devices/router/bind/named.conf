options {
    directory "/etc/config/bind";
    allow-transfer { none; };
    allow-update { none; };
};
controls { };

acl "internal" {
    127.0.0.1;
    10.20.0.0/16;
    ::1;
    fd00::/8;
};

view "internal" {
    match-clients { "internal"; };
    recursion yes;

    zone "keith.collister.xyz" {
        type master;
        file "/etc/config/bind/zones/keith.collister.xyz.zone";
    };
    zone "vpn.keith.collister.xyz" {
        type master;
        file "/etc/config/bind/zones/vpn.keith.collister.xyz.zone";
    };

    zone "warthog.keith.collister.xyz" {
        type master;
        file "/etc/config/bind/zones/internal/warthog.keith.collister.xyz.zone";
    };
    zone "ha.keith.collister.xyz" {
        type master;
        file "/etc/config/bind/zones/internal/ha.keith.collister.xyz.zone";
    };
};
view "external" {
    match-clients { any; };
    recursion no;

    zone "keith.collister.xyz" {
        type master;
        file "/etc/config/bind/zones/keith.collister.xyz.zone";
    };
    zone "vpn.keith.collister.xyz" {
        type master;
        file "/etc/config/bind/zones/vpn.keith.collister.xyz.zone";
    };

    zone "warthog.keith.collister.xyz" {
        type master;
        file "/etc/config/bind/zones/public/warthog.keith.collister.xyz.zone";
    };
    zone "ha.keith.collister.xyz" {
        type master;
        file "/etc/config/bind/zones/public/ha.keith.collister.xyz.zone";
    };
};
