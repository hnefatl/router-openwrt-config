options {
    directory "/etc/config/bind";
    allow-transfer { none; };
    allow-update { none; };
    allow-recursion { internal; };
};
controls { };

acl internal {
    127.0.0.1;
    10.20.0.0/16;
    ::1;
    fc00::/7;
    2a01:4b00:bd20:7000::/56;
};

zone "keith.collister.xyz" {
    type master;
    file "/etc/config/bind/zones/keith.collister.xyz.zone";
};
zone "vpn.keith.collister.xyz" {
    type master;
    file "/etc/config/bind/zones/vpn.keith.collister.xyz.zone";
};
zone "warthog.keith.collister.xyz" {
    type master;
    file "/etc/config/bind/zones/warthog.keith.collister.xyz.zone";
};
zone "ha.keith.collister.xyz" {
    type master;
    file "/etc/config/bind/zones/ha.keith.collister.xyz.zone";
};
